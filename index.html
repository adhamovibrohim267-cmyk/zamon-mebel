<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELITA Mebel</title>
<style>
:root{--m:#7a4a21;--m2:#a8672f;--bg:#faf6f1;--t:#2b2118}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--m);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:22px;letter-spacing:2px}
header a{color:#fff;text-decoration:none;background:var(--m2);padding:8px 12px;border-radius:8px;font-size:14px}
.hero{padding:28px 16px;text-align:center;background:linear-gradient(135deg,#e9d8c4,#f6ece0)}
.hero h2{font-size:24px;margin-bottom:8px}
.hero p{color:#5b4a3a}
.tools{padding:12px 16px;display:flex;gap:8px;flex-direction:column}
.tools input{padding:12px;border:1px solid #d8c9b8;border-radius:10px;font-size:16px;width:100%}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cats button{white-space:nowrap;border:1px solid var(--m2);background:#fff;color:var(--m);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.cats button.on{background:var(--m);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 16px 90px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column}
.img{height:130px;display:flex;align-items:center;justify-content:center;font-size:56px;background:#efe3d3}
.img img{width:100%;height:100%;object-fit:cover}
.info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.info b{font-size:15px}
.info small{color:#7b6a59;font-size:12px}
.price{color:var(--m);font-weight:bold;font-size:16px;margin-top:auto}
.card button{margin:0 10px 10px;padding:10px;border:0;background:var(--m2);color:#fff;border-radius:10px;font-size:14px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;padding:30px;color:#7b6a59}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.box{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px;display:flex;flex-direction:column;gap:10px}
.box input,.box textarea{padding:12px;border:1px solid #d8c9b8;border-radius:10px;font-size:16px;width:100%;font-family:inherit}
.box .row{display:flex;gap:8px}
.box .row button{flex:1;padding:12px;border:0;border-radius:10px;font-size:15px;color:#fff;cursor:pointer}
.send{background:#229ed9}.call{background:#2e8b57}.close{background:#999}
footer{background:var(--m);color:#fff;text-align:center;padding:18px 16px;font-size:14px;line-height:1.6}
footer a{color:#fff}
</style>
</head>
<body>

<header>
  <h1>ELITA MEBEL</h1>
  <a id="callTop" href="#">📞 Qo'ng'iroq</a>
</header>

<section class="hero">
  <h2>Sifatli mebel — o'z ustaxonamizdan</h2>
  <p>Buyurtma asosida ham tayyorlaymiz. Yetkazib berish bor.</p>
</section>

<div class="tools">
  <input id="q" type="search" placeholder="🔍 Mebel qidirish...">
  <div class="cats" id="cats"></div>
</div>

<main class="grid" id="grid"></main>

<footer>
  <div>ELITA MEBEL ustaxonasi</div>
  <div>📍 Manzil: shahar, ko'cha (o'zgartiring)</div>
  <div>📞 <a id="callFoot" href="#"></a> · ✈️ <a id="tgFoot" href="#" target="_blank"></a></div>

<div class="modal" id="modal">
  <div class="box">
    <b id="mTitle">Buyurtma</b>

    <input id="phone" type="tel" placeholder="Telefon raqamingiz">
    <textarea id="note" rows="2" placeholder="Izoh (rang, o'lcham...)"></textarea>
    <div class="row">
      <button class="send" onclick="sendTg()">Telegramga</button>
      <button class="call" onclick="callNow()">Qo'ng'iroq</button>
    </div>
    <div class="row"><button class="close" onclick="closeM()">Yopish</button></div>

const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("ru-RU").replace(/,/g," ")+" so'm";

$("callFoot").textContent=PHONE;
$("tgFoot").href="https://t.me/"+TG;

function renderCats(){
  const list=["Hammasi",...new Set(products.map(x=>x.c))];
  $("cats").innerHTML=list.map(c=>`<button class="${c===cat?"on":""}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){cat=c;renderCats();render();}
function render(){
  const q=$("q").value.toLowerCase().trim();
  const list=products.map((x,i)=>({...x,i})).filter(x=>(cat==="Hammasi"||x.c===cat)&&x.n.toLowerCase().includes(q));
  $("grid").innerHTML=list.length?list.map(x=>`
    <div class="card">
      <div class="img">${x.img?`<img src="${x.img}" alt="${x.n}">`:x.e}</div>
      <div class="info"><b>${x.n}</b><small>${x.d}</small><div class="price">${fmt(x.p)}</div></div>
      <button onclick="openM(${x.i})">Buyurtma berish</button>
    </div>`).join(""):`<div class="empty">Hech narsa topilmadi</div>`;
}
function openM(i){cur=products[i];$("mTitle").textContent="Buyurtma: "+cur.n;$("modal").classList.add("show");}
function closeM(){$("modal").classList.remove("show");}
function sendTg(){
  const t=`Salom! Buyurtma:\n${cur.n} — ${fmt(cur.p)}\nIsm: ${$("name").value}\nTel: ${$("phone").value}\nIzoh: ${$("note").value}`;
  window.open("https://t.me/"+TG+"?text="+encodeURIComponent(t),"_blank");
}
function callNow(){location.href="tel:"+PHONE;}
$("q").addEventListener("input",render);
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM();});
renderCats();render();
